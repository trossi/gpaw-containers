spack:
  upstreams:
    gcc15_core:
      install_tree: /appl/soft/spack/core/v2026_03/x86_64/gcc152_ec/install_dir/

  modules:
    default:
      enable: []

  specs:
  # Core libraries
  - openblas@0.3.30/qskucw
  - openmpi@5.0.10/jtu4ml
  - fftw@3.3.10/gafrwz
  - netlib-scalapack@2.2.2/stnq2q

  # Python with tkinter
  - python@3.14 +tkinter ^tk+xft+xss

  # Other packages
  - py-numpy@2.4
  - py-scipy@1.17
  - elpa@2024.05.001
  - dftd3-lib@0.10
  - dftd4@3.7.0 +python
# - py-pybind11@3.0.4

  # No auto-generated view here. Generated in Dockerfile instead
  view: false

  concretizer:
    reuse: true
    unify: when_possible
    duplicates:
      strategy: none
#     strategy: minimal
    targets:
      # Build for zen5 even when the build host is not zen5 (e.g. a CI runner).
      host_compatible: false

  packages:
    all:
      prefer:
      - "%gcc@15.2.0"
      - 'target=zen5'
      - '+openmp'

    gcc:
      buildable: false
      externals:
      - spec: gcc@15.2.0+binutils languages=c,c++,fortran,jit
        prefix: /appl/soft/spack/core/v2026_03/x86_64/compilers_ec/install_dir/zen5/gcc-14.1.0/gcc-15.2.0-cxeacg
        extra_attributes:
          compilers:
            c: /appl/soft/spack/core/v2026_03/x86_64/compilers_ec/install_dir/zen5/gcc-14.1.0/gcc-15.2.0-cxeacg/bin/gcc
            cxx: /appl/soft/spack/core/v2026_03/x86_64/compilers_ec/install_dir/zen5/gcc-14.1.0/gcc-15.2.0-cxeacg/bin/g++
            fortran: /appl/soft/spack/core/v2026_03/x86_64/compilers_ec/install_dir/zen5/gcc-14.1.0/gcc-15.2.0-cxeacg/bin/gfortran

    knem:
      buildable: false
      externals:
      - spec: knem@1.1.4 %c=gcc@15.2.0
        prefix: /opt/knem-1.1.4.90mlnx4

    mpi:
      buildable: false
    openmpi:
      buildable: false
#     require:
#     - openmpi@5.0.10/jtu4ml
      externals:
      - spec: openmpi@5.0.10
        prefix: /appl/soft/spack/core/v2026_03/x86_64/gcc152_ec/install_dir/zen5/gcc-15.2.0/openmpi@5.0.10-jtu4ml

    blas:
      buildable: false
    lapack:
      buildable: false
    openblas:
      buildable: false
      require:
      - openblas@0.3.30/qskucw
#     externals:
#     - spec: openblas@0.3.30
#       prefix: /appl/soft/spack/core/v2026_03/x86_64/gcc152_ec/install_dir/zen5/gcc-15.2.0/openblas@0.3.30-qskucw

    scalapack:
      buildable: false
    netlib-scalapack:
      buildable: false
#     require:
#     - netlib-scalapack@2.2.2/stnq2q
      externals:
      - spec: netlib-scalapack@2.2.2
        prefix: /appl/soft/spack/core/v2026_03/x86_64/gcc152_ec/install_dir/zen5/gcc-15.2.0/netlib-scalapack@2.2.2-stnq2q

    fftw-api:
      buildable: false
    fftw:
      buildable: false
#     require:
#     - fftw@3.3.10/gafrwz
      externals:
      - spec: fftw@3.3.10
        prefix: /appl/soft/spack/core/v2026_03/x86_64/gcc152_ec/install_dir/zen5/gcc-15.2.0/fftw@3.3.10-gafrwz

    libxcb:
      buildable: false
      externals:
      - spec: libxcb@1.13.1
        prefix: /usr

    libxft:
      buildable: false
      externals:
      - spec: libxft@2.3.3
        prefix: /usr

    libxscrnsaver:
      buildable: false
      externals:
      - spec: libxscrnsaver@1.2.3
        prefix: /usr

    libx11:
      buildable: false
      externals:
      - spec: libx11@1.7.0
        prefix: /usr

    git:
      buildable: false
      externals:
      - spec: git@2.52.0
        prefix: /usr
    tcl:
      buildable: false
      externals:
      - spec: tcl@8.6.10
        prefix: /usr
    tk:
      buildable: false
      externals:
      - spec: tk@8.6.10+xft+xss
        prefix: /usr

    intel-oneapi-mkl:
      buildable: false
    armpl-gcc:
      buildable: false
    amdblis:
      buildable: false
    amdfftw:
      buildable: false
    amdlibflame:
      buildable: false
